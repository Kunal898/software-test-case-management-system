<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="STCMS Reports - Testing summaries, charts, and data exports">
    <title>Reports - STCMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-wrapper">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="fas fa-vial"></i><h5>STCMS <span>Test Management</span></h5></div>
            <nav class="sidebar-nav">
                <div class="nav-section"><div class="nav-section-title">Main</div><a href="dashboard.html" class="nav-link-sidebar"><i class="fas fa-th-large"></i> Dashboard</a><a href="projects.html" class="nav-link-sidebar"><i class="fas fa-folder-open"></i> Projects</a></div>
                <div class="nav-section"><div class="nav-section-title">Testing</div><a href="test-cases.html" class="nav-link-sidebar"><i class="fas fa-list-check"></i> Test Cases</a><a href="test-execution.html" class="nav-link-sidebar"><i class="fas fa-play-circle"></i> Test Execution</a><a href="test-suites.html" class="nav-link-sidebar"><i class="fas fa-layer-group"></i> Test Suites</a><a href="bugs.html" class="nav-link-sidebar"><i class="fas fa-bug"></i> Bug Tracking</a></div>
                <div class="nav-section"><div class="nav-section-title">Analytics</div><a href="reports.html" class="nav-link-sidebar active"><i class="fas fa-chart-bar"></i> Reports</a><a href="rtm.html" class="nav-link-sidebar"><i class="fas fa-project-diagram"></i> RTM</a></div>
                <div class="nav-section"><div class="nav-section-title">Admin</div><a href="team.html" class="nav-link-sidebar"><i class="fas fa-users"></i> Team</a><a href="settings.html" class="nav-link-sidebar"><i class="fas fa-cog"></i> Settings</a><a href="help.html" class="nav-link-sidebar"><i class="fas fa-question-circle"></i> Help</a></div>
            </nav>
            <div class="sidebar-footer"><a href="#" class="nav-link-sidebar" onclick="logoutUser(); return false;"><i class="fas fa-sign-out-alt"></i> Logout</a></div>
        </div>
        <div class="overlay" id="sidebarOverlay"></div>

        <div class="main-content">
            <header class="top-header">
                <div class="header-left"><button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button><h1 class="page-title">Reports</h1></div>
                <div class="header-right">
                    <button class="header-btn theme-toggle" onclick="toggleTheme()" title="Toggle Theme"><i class="fas fa-moon" id="themeIcon"></i></button>
                    <div style="position:relative;"><button class="header-btn" id="notificationBtn" onclick="toggleNotifications()"><i class="fas fa-bell"></i><span class="notification-count" id="notificationCount" style="display:none;">0</span></button><div class="notification-dropdown" id="notificationDropdown"><div class="notification-header"><h6>Notifications</h6><button class="btn btn-sm btn-link" onclick="markAllNotificationsRead()">Mark all read</button></div><div class="notification-list" id="notificationList"></div></div></div>
                    <div class="user-dropdown"><div class="user-avatar" id="headerUserAvatar">AU</div><div class="user-info"><span class="user-name" id="headerUserName">Admin</span><span class="user-role" id="headerUserRole">Admin</span></div></div>
                </div>
            </header>

            <div class="page-content">
                <div class="page-header">
                    <div><h2>Reports</h2><p>Testing summaries, analytics, and data exports</p></div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-primary" onclick="printContent('reportContent')"><i class="fas fa-print"></i> Print</button>
                        <button class="btn btn-outline-primary" onclick="exportAllJSON()"><i class="fas fa-download"></i> Export All (JSON)</button>
                    </div>
                </div>

                <div id="reportContent">
                    <!-- Report Selector -->
                    <div class="card mb-4">
                        <div class="card-body">
                            <div class="row g-3 align-items-end">
                                <div class="col-md-4">
                                    <label class="form-label">Select Report</label>
                                    <select class="form-select" id="reportType" onchange="generateReport()">
                                        <option value="summary">Test Execution Summary</option>
                                        <option value="testStatus">Test Case Status Report</option>
                                        <option value="bugSummary">Bug Summary Report</option>
                                        <option value="bugSeverity">Bug Severity Report</option>
                                        <option value="bugPriority">Bug Priority Report</option>
                                        <option value="testerPerformance">Tester Performance</option>
                                        <option value="projectProgress">Project Testing Progress</option>
                                        <option value="failedTests">Failed Test Cases</option>
                                        <option value="openBugs">Open Bugs Report</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Project Filter</label>
                                    <select class="form-select" id="reportProjectFilter" onchange="generateReport()">
                                        <option value="">All Projects</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <button class="btn btn-primary w-100" onclick="generateReport()"><i class="fas fa-sync"></i> Generate Report</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Report Output -->
                    <div id="reportOutput"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
