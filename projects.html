<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="STCMS Projects - Manage software projects for testing">
    <title>Projects - STCMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-wrapper">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-brand"><i class="fas fa-vial"></i><h5>STCMS <span>Test Management</span></h5></div>
            <nav class="sidebar-nav">
                <div class="nav-section"><div class="nav-section-title">Main</div><a href="dashboard.html" class="nav-link-sidebar"><i class="fas fa-th-large"></i> Dashboard</a><a href="projects.html" class="nav-link-sidebar active"><i class="fas fa-folder-open"></i> Projects</a></div>
                <div class="nav-section"><div class="nav-section-title">Testing</div><a href="test-cases.html" class="nav-link-sidebar"><i class="fas fa-list-check"></i> Test Cases</a><a href="test-execution.html" class="nav-link-sidebar"><i class="fas fa-play-circle"></i> Test Execution</a><a href="test-suites.html" class="nav-link-sidebar"><i class="fas fa-layer-group"></i> Test Suites</a><a href="bugs.html" class="nav-link-sidebar"><i class="fas fa-bug"></i> Bug Tracking</a></div>
                <div class="nav-section"><div class="nav-section-title">Analytics</div><a href="reports.html" class="nav-link-sidebar"><i class="fas fa-chart-bar"></i> Reports</a><a href="rtm.html" class="nav-link-sidebar"><i class="fas fa-project-diagram"></i> RTM</a></div>
                <div class="nav-section"><div class="nav-section-title">Admin</div><a href="team.html" class="nav-link-sidebar"><i class="fas fa-users"></i> Team</a><a href="settings.html" class="nav-link-sidebar"><i class="fas fa-cog"></i> Settings</a><a href="help.html" class="nav-link-sidebar"><i class="fas fa-question-circle"></i> Help</a></div>
            </nav>
            <div class="sidebar-footer"><a href="#" class="nav-link-sidebar" onclick="logoutUser(); return false;"><i class="fas fa-sign-out-alt"></i> Logout</a></div>
        </div>
        <div class="overlay" id="sidebarOverlay"></div>

        <div class="main-content">
            <header class="top-header">
                <div class="header-left"><button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button><h1 class="page-title">Projects</h1></div>
                <div class="header-right">
                    <button class="header-btn theme-toggle" onclick="toggleTheme()" title="Toggle Theme"><i class="fas fa-moon" id="themeIcon"></i></button>
                    <div style="position:relative;"><button class="header-btn" id="notificationBtn" onclick="toggleNotifications()"><i class="fas fa-bell"></i><span class="notification-count" id="notificationCount" style="display:none;">0</span></button><div class="notification-dropdown" id="notificationDropdown"><div class="notification-header"><h6>Notifications</h6><button class="btn btn-sm btn-link" onclick="markAllNotificationsRead()">Mark all read</button></div><div class="notification-list" id="notificationList"></div></div></div>
                    <div class="user-dropdown"><div class="user-avatar" id="headerUserAvatar">AU</div><div class="user-info"><span class="user-name" id="headerUserName">Admin</span><span class="user-role" id="headerUserRole">Admin</span></div></div>
                </div>
            </header>

            <div class="page-content">
                <div class="page-header">
                    <div><h2>Projects</h2><p>Manage your software testing projects</p></div>
                    <div class="d-flex gap-2">
                        <div class="search-box" style="position:relative;"><i class="fas fa-search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gray-light);"></i><input type="text" class="form-control" id="projectSearch" placeholder="Search projects..." style="padding-left:36px;" oninput="renderProjects()"></div>
                        <select class="form-select" id="projectStatusFilter" style="width:150px;" onchange="renderProjects()"><option value="">All Status</option><option value="Planning">Planning</option><option value="Active">Active</option><option value="Testing">Testing</option><option value="Completed">Completed</option><option value="On Hold">On Hold</option></select>
                        <button class="btn btn-primary" onclick="openProjectModal()"><i class="fas fa-plus"></i> Add Project</button>
                    </div>
                </div>

                <div class="project-cards" id="projectCards"></div>
            </div>
        </div>
    </div>

    <!-- Project Modal -->
    <div class="modal fade" id="projectModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="projectModalTitle">Add Project</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <form id="projectForm">
                <input type="hidden" id="projectId">
                <div class="row g-3">
                    <div class="col-md-6"><label for="projectName" class="form-label">Project Name *</label><input type="text" class="form-control" id="projectName" required minlength="3"><div class="invalid-feedback"></div></div>
                    <div class="col-md-6"><label for="projectVersion" class="form-label">Version *</label><input type="text" class="form-control" id="projectVersion" required placeholder="e.g., 1.0.0"><div class="invalid-feedback"></div></div>
                    <div class="col-12"><label for="projectDesc" class="form-label">Description *</label><textarea class="form-control" id="projectDesc" rows="3" required minlength="10"></textarea><div class="invalid-feedback"></div></div>
                    <div class="col-md-6"><label for="projectStartDate" class="form-label">Start Date *</label><input type="date" class="form-control" id="projectStartDate" required><div class="invalid-feedback"></div></div>
                    <div class="col-md-6"><label for="projectEndDate" class="form-label">End Date *</label><input type="date" class="form-control" id="projectEndDate" required><div class="invalid-feedback"></div></div>
                    <div class="col-md-6"><label for="projectManager" class="form-label">Project Manager *</label><select class="form-select" id="projectManager" required><option value="">Select Manager</option></select><div class="invalid-feedback"></div></div>
                    <div class="col-md-6"><label for="projectStatus" class="form-label">Status *</label><select class="form-select" id="projectStatus" required><option value="Planning">Planning</option><option value="Active">Active</option><option value="Testing">Testing</option><option value="Completed">Completed</option><option value="On Hold">On Hold</option></select><div class="invalid-feedback"></div></div>
                </div>
            </form>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-primary" onclick="saveProject()"><i class="fas fa-save"></i> Save Project</button></div>
    </div></div></div>

    <!-- View Project Modal -->
    <div class="modal fade" id="viewProjectModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Project Details</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="viewProjectBody"></div>
    </div></div></div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/app.js"></script>
    <script src="js/projects.js"></script>
</body>
</html>
