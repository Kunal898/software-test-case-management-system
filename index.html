<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Software Test Case Management System - Login to manage your QA testing workflow">
    <title>Login - STCMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo">
                <i class="fas fa-vial"></i>
                <h1>STCMS</h1>
                <p>Software Test Case Management System</p>
            </div>

            <div class="login-error" id="loginError">
                <i class="fas fa-exclamation-circle"></i>
                <span id="loginErrorMsg">Invalid username or password</span>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="Enter username" required autocomplete="username">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Enter password" required autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="demo-credentials">
                <h6>Demo Credentials</h6>
                <div class="credential-item" onclick="fillCredentials('admin', 'admin123')">
                    <span><i class="fas fa-user-shield"></i> admin / admin123</span>
                    <span class="role-badge" style="background:var(--primary-bg);color:var(--primary);">Admin</span>
                </div>
                <div class="credential-item" onclick="fillCredentials('tester', 'tester123')">
                    <span><i class="fas fa-flask"></i> tester / tester123</span>
                    <span class="role-badge" style="background:var(--success-bg);color:var(--success);">Tester</span>
                </div>
                <div class="credential-item" onclick="fillCredentials('developer', 'developer123')">
                    <span><i class="fas fa-code"></i> developer / developer123</span>
                    <span class="role-badge" style="background:var(--purple-bg);color:var(--purple);">Developer</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Redirect if already logged in
        if (isAuthenticated()) {
            window.location.href = 'dashboard.html';
        }

        function fillCredentials(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginError');
            const errorMsg = document.getElementById('loginErrorMsg');

            if (!username || !password) {
                errorEl.style.display = 'block';
                errorMsg.textContent = 'Please enter both username and password';
                return;
            }

            const result = loginUser(username, password);
            if (result.success) {
                window.location.href = 'dashboard.html';
            } else {
                errorEl.style.display = 'block';
                errorMsg.textContent = result.message;
                document.getElementById('password').value = '';
            }
        }
    </script>
</body>
</html>
